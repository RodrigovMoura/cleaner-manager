<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="sparkleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App icon background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Main Sparkle (Center-Left) -->
  <g filter="url(#glow)">
    <!-- Outer gold star -->
    <path d="M 230,140 Q 230,290 380,290 Q 230,290 230,440 Q 230,290 80,290 Q 230,290 230,140 Z" fill="url(#sparkleGold)" />
    <!-- Inner bright star -->
    <path d="M 230,185 Q 230,290 335,290 Q 230,290 230,395 Q 230,290 125,290 Q 230,290 230,185 Z" fill="#fffbeb" />
    <!-- White center shine -->
    <circle cx="230" cy="290" r="16" fill="#ffffff" />
  </g>

  <!-- Top-Right Sparkle (Medium) -->
  <g filter="url(#glow)">
    <path d="M 380,70 Q 380,160 470,160 Q 380,160 380,250 Q 380,160 290,160 Q 380,160 380,70 Z" fill="url(#sparkleGold)" />
    <path d="M 380,100 Q 380,160 440,160 Q 380,160 380,220 Q 380,160 320,160 Q 380,160 380,100 Z" fill="#fffbeb" />
    <circle cx="380" cy="160" r="10" fill="#ffffff" />
  </g>

  <!-- Bottom-Left Sparkle (Small) -->
  <g filter="url(#glow)">
    <path d="M 120,380 Q 120,435 175,435 Q 120,435 120,490 Q 120,435 65,435 Q 120,435 120,380 Z" fill="url(#sparkleGold)" />
    <path d="M 120,400 Q 120,435 155,435 Q 120,435 120,470 Q 120,435 85,435 Q 120,435 120,400 Z" fill="#fffbeb" />
    <circle cx="120" cy="435" r="6" fill="#ffffff" />
  </g>

  <!-- Tiny twinkle (Top-Left) -->
  <path d="M 120,120 Q 120,150 150,150 Q 120,150 120,180 Q 120,150 90,150 Q 120,150 120,120 Z" fill="#fef08a" opacity="0.9" />
</svg>
